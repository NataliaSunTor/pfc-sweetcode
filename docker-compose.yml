services:
  mysql:
    image: mysql:8.4
    container_name: sweetcode-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"   # MySQL Workbench: 127.0.0.1:3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend:/app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    container_name: sweetcode-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app          # ← código en vivo
      - backend_node_modules:/app/node_modules  # ← volumen nombrado: controlable a mano
    command: npm run dev
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    container_name: sweetcode-frontend
    restart: unless-stopped
    ports:
      - "5173:80"     # build de producción servido por nginx en http://localhost:5173
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:12.0.4
    container_name: sweetcode-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3001:3000"   # Grafana en http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  grafana_data:
  backend_node_modules:
